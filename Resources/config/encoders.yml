pumukit_youtube:
    profiles:
        video_youtube:
            display: false
            wizard: false
            master: false
            tags: youtube html5
            target: PUCHYOUTUBE
            extension: mp4
            resolution_hor: 0
            resolution_ver: 0
            audio: true
            bat: |
                ffmpeg -loop 1 -i __IMAGE__ -i "{{input}}" -s 640x480 -c:v libx264 -c:a libfdk_aac -strict experimental -ar 44100 -b:a 128k -f mp4 -shortest "{{output}}"
            streamserver:
                dir_out: "%pumukit.downloads_dir%"
                url_out: "%pumukit.downloads_url%"
            downloadable: true
            generate_pic: false
