services:
  _defaults:
    autowire:      true
    autoconfigure: true
    public:        true
    bind:
      $pumukitLocales: "%pumukit.locales%"
      $tempDir: "%pumukit.tmp%"
      $picDir: "%pumukit.uploads_pic_dir%"
      $accountStorage: "%pumukit_youtube.account_storage%"

  Pumukit\YoutubeBundle\Controller\:
    resource: '../../Controller'
    tags: ['controller.service_arguments']

  # Infrastructure Controllers - DISABLED (using Hexagonal Architecture instead)
  # Pumukit\YoutubeBundle\Infrastructure\Controller\YoutubeUploadController:
  #   autowire: true
  #   tags: ['controller.service_arguments']
  #
  # Pumukit\YoutubeBundle\Infrastructure\Controller\QuotaController:
  #   autowire: true
  #   tags: ['controller.service_arguments']
  #
  # Pumukit\YoutubeBundle\Infrastructure\Controller\YoutubeVideoManagementController:
  #   autowire: true
  #   tags: ['controller.service_arguments']
  #
  # Pumukit\YoutubeBundle\Infrastructure\Controller\YoutubePlaylistController:
  #   autowire: true
  #   tags: ['controller.service_arguments']
  #
  # Pumukit\YoutubeBundle\Infrastructure\Controller\YoutubePublicationConfigController:
  #   autowire: true
  #   tags: ['controller.service_arguments']

  # Hexagonal Architecture Controllers
  Pumukit\YoutubeBundle\PlaylistHexagonal\UI\Backoffice\Controller\:
    resource: '../../PlaylistHexagonal/UI/Backoffice/Controller'
    autoconfigure: true
    tags: ['controller.service_arguments']

  Pumukit\YoutubeBundle\AccountHexagonal\UI\Backoffice\Controller\:
    resource: '../../AccountHexagonal/UI/Backoffice/Controller'
    autoconfigure: true
    tags: ['controller.service_arguments']

  Pumukit\YoutubeBundle\VideoHexagonal\UI\Backoffice\Controller\:
    resource: '../../VideoHexagonal/UI/Backoffice/Controller'
    autoconfigure: true
    tags: ['controller.service_arguments']

  Pumukit\YoutubeBundle\CaptionHexagonal\UI\Backoffice\Controller\:
    resource: '../../CaptionHexagonal/UI/Backoffice/Controller'
    autoconfigure: true
    tags: ['controller.service_arguments']

  Pumukit\YoutubeBundle\Command\:
    resource: '../../Command/'
    tags:
      - { name: 'console.command' }
      - { name: 'monolog.logger', channel: 'youtube' }

  # Command with transport dependency - MOVIDO A QuotaHexagonal/Infrastructure/CLI/
  # Pumukit\YoutubeBundle\Application\Command\Quota\ProcessQuotaWaitingCommand:
  #   arguments:
  #     $quotaWaitingTransport: '@messenger.transport.pumukit.youtube.quota.waiting'
  #   tags:
  #     - { name: 'console.command' }

  # ============================================================================
  # EVENT LISTENERS
  # ============================================================================

  # BackofficeListener - Escucha publication.submit y despacha mensajes de upload
  Pumukit\YoutubeBundle\EventListener\BackofficeListener:
    arguments:
      $documentManager: '@doctrine_mongodb.odm.document_manager'
      $tagService: '@pumukitschema.tag'
      $messageBus: '@messenger.default_bus'
      $logger: '@monolog.logger.youtube'
      $videoDataValidationService: '@Pumukit\YoutubeBundle\Services\VideoDataValidationService'
    tags:
      - { name: 'kernel.event_listener', event: 'publication.submit', method: 'onPublicationSubmit' }

  # Messenger Debug Listener
  Pumukit\YoutubeBundle\EventListener\MessengerDebugListener:
    autowire: true
    tags:
      - { name: kernel.event_subscriber }

  # Middleware - Quota Check
  Pumukit\YoutubeBundle\Infrastructure\Middleware\QuotaCheckMiddleware:
    autowire: true

  # Query Handlers
  Pumukit\YoutubeBundle\QuotaHexagonal\Application\Query\GetQuotaStatusQueryHandler:
    autowire: true

  # Domain Services
  Pumukit\YoutubeBundle\Domain\Service\:
    resource: '../../Domain/Service'
    exclude:
      - '../../Domain/Service/Validation'
    autowire: true

  # Application Services (Hexagonal) - Only Playlist, Account, Caption
  # (Video is handled separately below with exclusions)
  Pumukit\YoutubeBundle\PlaylistHexagonal\Application\:
    resource: '../../PlaylistHexagonal/Application'
    exclude:
      - '../../PlaylistHexagonal/Application/*/*Message.php'
      - '../../PlaylistHexagonal/Application/*/*Request.php'
      - '../../PlaylistHexagonal/Application/*/*Response.php'
    autowire: true

  Pumukit\YoutubeBundle\AccountHexagonal\Application\:
    resource: '../../AccountHexagonal/Application'
    exclude:
      - '../../AccountHexagonal/Application/*/*Message.php'
      - '../../AccountHexagonal/Application/*/*Request.php'
      - '../../AccountHexagonal/Application/*/*Response.php'
    autowire: true

  Pumukit\YoutubeBundle\CaptionHexagonal\Application\:
    resource: '../../CaptionHexagonal/Application'
    exclude:
      - '../../CaptionHexagonal/Application/*/*Message.php'
      - '../../CaptionHexagonal/Application/*/*Request.php'
      - '../../CaptionHexagonal/Application/*/*Response.php'
    autowire: true

  # Shared Domain Services
  Pumukit\YoutubeBundle\Shared\Domain\Service\QuotaService:
    autowire: true

  Pumukit\YoutubeBundle\Shared\Domain\Service\ErrorClassificationService:
    autowire: true

  # Infrastructure Services
  Pumukit\YoutubeBundle\Infrastructure\Service\:
    resource: '../../Infrastructure/Service'
    exclude:
      - '../../Infrastructure/Service/QueueDrainService.php'
    autowire: true

  # Shared Infrastructure Services
  Pumukit\YoutubeBundle\Shared\Infrastructure\Service\GoogleClientFactory:
    autowire: true

  Pumukit\YoutubeBundle\Shared\Infrastructure\Service\QueueDrainService:
    arguments:
      $messengerTransportDsn: '%env(MESSENGER_TRANSPORT_DSN)%'

  Pumukit\YoutubeBundle\Infrastructure\Repository\:
    resource: '../../Infrastructure/Repository'
    autowire: true

  # Repository Interface Aliases
  Pumukit\YoutubeBundle\Shared\Infrastructure\Repository\DoctrinePublicationRepository:
    autowire: true

  Pumukit\YoutubeBundle\Domain\Repository\PublicationRepositoryInterface: '@Pumukit\YoutubeBundle\Shared\Infrastructure\Repository\DoctrinePublicationRepository'
  
  Pumukit\YoutubeBundle\Shared\Domain\Repository\PublicationRepositoryInterface: '@Pumukit\YoutubeBundle\Shared\Infrastructure\Repository\DoctrinePublicationRepository'

  # PlaylistHexagonal Repository
  Pumukit\YoutubeBundle\PlaylistHexagonal\Infrastructure\Persistence\DoctrinePlaylistRepository:
    autowire: true

  Pumukit\YoutubeBundle\PlaylistHexagonal\Domain\Repository\PlaylistRepositoryInterface: '@Pumukit\YoutubeBundle\PlaylistHexagonal\Infrastructure\Persistence\DoctrinePlaylistRepository'

  # PlaylistHexagonal YoutubeApi
  Pumukit\YoutubeBundle\PlaylistHexagonal\Infrastructure\ExternalService\GoogleYoutubePlaylistApi:
    autowire: true

  Pumukit\YoutubeBundle\PlaylistHexagonal\Domain\Repository\YoutubeApiInterface: '@Pumukit\YoutubeBundle\PlaylistHexagonal\Infrastructure\ExternalService\GoogleYoutubePlaylistApi'

  # AccountHexagonal Repository
  Pumukit\YoutubeBundle\AccountHexagonal\Infrastructure\Persistence\DoctrineAccountRepository:
    autowire: true

  Pumukit\YoutubeBundle\AccountHexagonal\Domain\Repository\AccountRepositoryInterface: '@Pumukit\YoutubeBundle\AccountHexagonal\Infrastructure\Persistence\DoctrineAccountRepository'

  # VideoHexagonal Repository
  Pumukit\YoutubeBundle\VideoHexagonal\Infrastructure\Persistence\DoctrineVideoRepository:
    autowire: true

  Pumukit\YoutubeBundle\VideoHexagonal\Domain\Repository\VideoRepositoryInterface: '@Pumukit\YoutubeBundle\VideoHexagonal\Infrastructure\Persistence\DoctrineVideoRepository'

  # CaptionHexagonal Repository
  Pumukit\YoutubeBundle\CaptionHexagonal\Infrastructure\Persistence\DoctrineCaptionRepository:
    autowire: true

  Pumukit\YoutubeBundle\CaptionHexagonal\Domain\Repository\CaptionRepositoryInterface: '@Pumukit\YoutubeBundle\CaptionHexagonal\Infrastructure\Persistence\DoctrineCaptionRepository'

  # YoutubeAccount Repository
  Pumukit\YoutubeBundle\Shared\Infrastructure\Repository\DoctrineYoutubeAccountRepository:
    autowire: true

  Pumukit\YoutubeBundle\Shared\Domain\Repository\YoutubeAccountRepositoryInterface: '@Pumukit\YoutubeBundle\Shared\Infrastructure\Repository\DoctrineYoutubeAccountRepository'

  # AccountHexagonal YoutubeAccountApi
  Pumukit\YoutubeBundle\AccountHexagonal\Infrastructure\ExternalService\GoogleYoutubeAccountApi:
    autowire: true

  Pumukit\YoutubeBundle\AccountHexagonal\Domain\Repository\YoutubeAccountApiInterface: '@Pumukit\YoutubeBundle\AccountHexagonal\Infrastructure\ExternalService\GoogleYoutubeAccountApi'

  # VideoHexagonal YoutubeVideoApi
  Pumukit\YoutubeBundle\VideoHexagonal\Infrastructure\ExternalService\GoogleYoutubeVideoApi:
    autowire: true

  Pumukit\YoutubeBundle\VideoHexagonal\Domain\Repository\YoutubeVideoApiInterface: '@Pumukit\YoutubeBundle\VideoHexagonal\Infrastructure\ExternalService\GoogleYoutubeVideoApi'

  # CaptionHexagonal YoutubeCaptionApi
  Pumukit\YoutubeBundle\CaptionHexagonal\Infrastructure\ExternalService\GoogleYoutubeCaptionApi:
    autowire: true

  Pumukit\YoutubeBundle\CaptionHexagonal\Domain\Repository\YoutubeCaptionApiInterface: '@Pumukit\YoutubeBundle\CaptionHexagonal\Infrastructure\ExternalService\GoogleYoutubeCaptionApi'
  
  # Application UseCase Services (ONLY UseCase, NOT MessageHandlers)
  Pumukit\YoutubeBundle\Application\UseCase\:
    resource: '../../Application/UseCase'
    autowire: true

  # VideoHexagonal Message Handlers - explicit registration
  Pumukit\YoutubeBundle\VideoHexagonal\Application\Upload\UploadVideoMessageHandler:
    autowire: true
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default', from_transport: 'pumukit.youtube.events' }

  Pumukit\YoutubeBundle\VideoHexagonal\Application\Playlist\AddToPlaylistsMessageHandler:
    autowire: true
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default', from_transport: 'pumukit.youtube.events' }

  # QuotaHexagonal Message Handlers - Waiting Queue (DISABLED - Only processed by cron youtube:quota:recover-waiting-messages)
  # Pumukit\YoutubeBundle\QuotaHexagonal\Application\Waiting\WaitingMessageHandler:
  #   autowire: true
  #   tags:
  #     - { name: 'messenger.message_handler', bus: 'messenger.bus.default', from_transport: 'pumukit.youtube.quota.waiting' }

  # QuotaHexagonal Message Handlers - Failed Queue
  Pumukit\YoutubeBundle\QuotaHexagonal\Application\Failed\FailedVideoMessageHandler:
    autowire: true
    tags:
      - { name: 'messenger.message_handler', bus: 'messenger.bus.default', from_transport: 'pumukit.youtube.quota.failed' }

  Pumukit\YoutubeBundle\VideoHexagonal\Application\Upload\UploadVideoService:
    autowire: true

  Pumukit\YoutubeBundle\VideoHexagonal\Application\Playlist\AddVideoToPlaylistsService:
    autowire: true

  Pumukit\YoutubeBundle\VideoHexagonal\Application\Upload\UploadVideoValidator:
    autowire: true

  # VideoHexagonal Application Services (excluding Messages and DTOs)
  Pumukit\YoutubeBundle\VideoHexagonal\Application\:
    resource: '../../VideoHexagonal/Application'
    exclude:
      - '../../VideoHexagonal/Application/*/*Message.php'
      - '../../VideoHexagonal/Application/*/*Request.php'
      - '../../VideoHexagonal/Application/*/*Response.php'
      - '../../VideoHexagonal/Application/Upload/UploadVideoMessageHandler.php'
      - '../../VideoHexagonal/Application/Playlist/AddToPlaylistsMessageHandler.php'
    autowire: true

  # VideoHexagonal Domain Services
  Pumukit\YoutubeBundle\VideoHexagonal\Domain\:
    resource: '../../VideoHexagonal/Domain'
    exclude:
      - '../../VideoHexagonal/Domain/Event'
      - '../../VideoHexagonal/Domain/Model'
      - '../../VideoHexagonal/Domain/ValueObject'
    autowire: true

  # VideoHexagonal Infrastructure
  Pumukit\YoutubeBundle\VideoHexagonal\Infrastructure\:
    resource: '../../VideoHexagonal/Infrastructure'
    autowire: true

  Pumukit\YoutubeBundle\Services\MenuService:
    class: Pumukit\YoutubeBundle\Services\MenuService
    tags:
      - { name: "pumukitnewadmin.menuitem" }

  Pumukit\YoutubeBundle\Services\MenuStatService:
    class: Pumukit\YoutubeBundle\Services\MenuStatService
    tags:
      - { name: "pumukitnewadmin.menuitem" }

  Pumukit\YoutubeBundle\Services\MenuPlaylistService:
    class: Pumukit\YoutubeBundle\Services\MenuPlaylistService
    tags:
      - { name: "pumukitnewadmin.menuitem" }

  Pumukit\YoutubeBundle\Services\MenuQuotaService:
    class: Pumukit\YoutubeBundle\Services\MenuQuotaService
    tags:
      - { name: "pumukitnewadmin.menuitem" }

  # Disabled: Requires custom controllers
  # Pumukit\YoutubeBundle\Services\MenuStatsService:
  #   class: Pumukit\YoutubeBundle\Services\MenuStatsService
  #   tags:
  #     - { name: "pumukitnewadmin.menuitem" }

  Pumukit\YoutubeBundle\Services\MultimediaObjectMenuService:
    class: Pumukit\YoutubeBundle\Services\MultimediaObjectMenuService
    tags:
      - { name: "pumukitnewadmin.mmobjmenuitem" }

  Pumukit\YoutubeBundle\Services\YoutubeStatsService:
    class: Pumukit\YoutubeBundle\Services\YoutubeStatsService

  Pumukit\YoutubeBundle\Services\YoutubeConfigurationService:
    class: Pumukit\YoutubeBundle\Services\YoutubeConfigurationService
    arguments:
      $playlistPrivateStatus: "%pumukit_youtube.playlist_privacy_status%"
      $playlistMaster: "%pumukit_youtube.playlists_master%"
      $deletePlaylist: "%pumukit_youtube.delete_playlists%"
      $locale: "%pumukit_youtube.locale%"
      $publicationChannelsTags: "%pumukit_youtube.pub_channels_tags%"
      $syncStatus: "%pumukit_youtube.sync_status%"
      $defaultTrackUpload: "%pumukit_youtube.default_track_upload%"
      $defaultImageForAudio: "%pumukit_youtube.default_image_for_audio%"
      $allowedCaptionMimeTypes: "%pumukit_youtube.allowed_caption_mimetypes%"
      $generateSbs: "%pumukit_youtube.generate_sbs%"
      $uploadRemovedVideos: "%pumukit_youtube.upload_removed_videos%"
      $sbsProfileName: "%pumukit_youtube.sbs_profile_name%"
      $accountStorage: "%pumukit_youtube.account_storage%"

  Pumukit\YoutubeBundle\Services\GoogleAccountService:
    class: Pumukit\YoutubeBundle\Services\GoogleAccountService

  Pumukit\YoutubeBundle\Twig\YoutubeExtension:
    class: Pumukit\YoutubeBundle\Twig\YoutubeExtension
    tags:
      - { name: "twig.extension" }

  Pumukit\YoutubeBundle\Services\GooglePlaylistService:
    class: Pumukit\YoutubeBundle\Services\GooglePlaylistService


  Pumukit\YoutubeBundle\Services\GooglePlaylistItemService:
    class: Pumukit\YoutubeBundle\Services\GooglePlaylistItemService

  Pumukit\YoutubeBundle\Services\PlaylistItemInsertService:
    class: Pumukit\YoutubeBundle\Services\PlaylistItemInsertService

  Pumukit\YoutubeBundle\Services\PlaylistItemDeleteService:
    class: Pumukit\YoutubeBundle\Services\PlaylistItemDeleteService

  Pumukit\YoutubeBundle\Services\GoogleResourceService:
    class: Pumukit\YoutubeBundle\Services\GoogleResourceService

  Pumukit\YoutubeBundle\Services\PlaylistDataValidationService:
    class: Pumukit\YoutubeBundle\Services\PlaylistDataValidationService

  Pumukit\YoutubeBundle\Services\PlaylistInsertService:
    class: Pumukit\YoutubeBundle\Services\PlaylistInsertService

  Pumukit\YoutubeBundle\Services\PlaylistListService:
    class: Pumukit\YoutubeBundle\Services\PlaylistListService

  Pumukit\YoutubeBundle\Services\PlaylistDeleteService:
    class: Pumukit\YoutubeBundle\Services\PlaylistDeleteService

  Pumukit\YoutubeBundle\Services\GoogleVideoService:
    class: Pumukit\YoutubeBundle\Services\GoogleVideoService

  Pumukit\YoutubeBundle\Services\VideoInsertService:
    class: Pumukit\YoutubeBundle\Services\VideoInsertService

  Pumukit\YoutubeBundle\Services\VideoUpdateService:
    class: Pumukit\YoutubeBundle\Services\VideoUpdateService

  Pumukit\YoutubeBundle\Services\VideoListService:
    class: Pumukit\YoutubeBundle\Services\VideoListService

  Pumukit\YoutubeBundle\Services\VideoDeleteService:
    class: Pumukit\YoutubeBundle\Services\VideoDeleteService

  Pumukit\YoutubeBundle\Services\VideoDataValidationService:
    class: Pumukit\YoutubeBundle\Services\VideoDataValidationService

  Pumukit\YoutubeBundle\Services\NotificationService:
    class: Pumukit\YoutubeBundle\Services\NotificationService

  Pumukit\YoutubeBundle\Services\CaptionsInsertService:
    class: Pumukit\YoutubeBundle\Services\CaptionsInsertService

  Pumukit\YoutubeBundle\Services\CaptionsDeleteService:
    class: Pumukit\YoutubeBundle\Services\CaptionsDeleteService

  Pumukit\YoutubeBundle\Services\CaptionsListService:
    class: Pumukit\YoutubeBundle\Services\CaptionsListService

  Pumukit\YoutubeBundle\Services\CaptionsDataValidationService:
    class: Pumukit\YoutubeBundle\Services\CaptionsDataValidationService


  Pumukit\YoutubeBundle\Services\CommonDataValidationService:
    class: Pumukit\YoutubeBundle\Services\CommonDataValidationService

  # Domain Services - Validation (moved to Shared/)
  Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeSanitizer:
    class: Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeSanitizer

  Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeFileValidator:
    class: Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeFileValidator
    arguments:
      - '@logger'

  Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeMetadataValidator:
    class: Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeMetadataValidator

  # Legacy aliases for backward compatibility
  Pumukit\YoutubeBundle\Domain\Service\Validation\YoutubeSanitizer:
    alias: Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeSanitizer

  Pumukit\YoutubeBundle\Domain\Service\Validation\YoutubeFileValidator:
    alias: Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeFileValidator

  Pumukit\YoutubeBundle\Domain\Service\Validation\YoutubeMetadataValidator:
    alias: Pumukit\YoutubeBundle\Shared\Domain\Service\Validation\YoutubeMetadataValidator


  # Event Listeners
  Pumukit\YoutubeBundle\EventListener\AutoUploadOnTagListener:
    class: Pumukit\YoutubeBundle\EventListener\AutoUploadOnTagListener
    arguments:
      - '@messenger.default_bus'
      - '@logger'
    tags:
      - { name: kernel.event_subscriber }

  # Command Services - DrainQuotaWaiting (eliminado - duplicado)
